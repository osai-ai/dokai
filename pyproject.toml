[project]
name = "Dokai"
authors = [{name = "AC Optimization Squad", email = "v.smirnov@sportradar.com>"}]
description = "Set of pre-built base docker images."
version = "v24.06"
readme = "README.md"

[tool.docformatter]
recursive = true
wrap-summaries = 100
blank = true
black = true
in-place = true

[tool.black]
line-length = 100
skip-magic-trailing-comma = true
target-version = ["py311"]
include = "\\.pyi?$"
force-exclude = """
(
  /(
      tests
  )/
)
"""

[tool.darglint]
# darglint configuration:
# https://github.com/terrencepreilly/darglint
strictness = "long"

[tool.flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
ignore = [
    # ignored unused imports, because of the way we test modules
    "F401",
    # ignored for compatibility between black and pep8
    "E203", "W503",
    # too subjective checks for docstring format
    "D401", "D402",
    # temp, security issues should be fixed in ACTT-675
    "S104", "S301", "S403", "S404", "S506", "S602", "S603",

    "S311", "S314", "S405", "S607", "S614"
]
per-file-ignores = [
    "__init__.py:F401,E501,D400",
    "tests/**/*.py:S",
]
exclude = [
    ".git,",
    "__pycache__",
    "build",
    "dist",
    "logs",
    "tests/**",
]
max-line-length = 100
show-source = false
statistics = true
doctests = true
inline-quotes = "double"
require_plugins = [
    "darglint==1.8.1",
    "flake8-bandit==4.1.1",
    "flake8-black==0.3.6",
    "flake8-isort==6.1.1",
    "flake8-pyproject==1.2.3",
    "flake8-docstrings==1.7.0",
    "flake8-coding==1.3.2"
]
no-accept-encodings = true

[tool.isort]
# isort configuration:
# https://pycqa.github.io/isort/docs/configuration/profiles.html
profile = "black"
line_length = 100

[tool.mypy]
plugins = [
  "numpy.typing.mypy_plugin",
]
disallow_untyped_defs = true
# disallow_any_unimported = true  #NOTE: to enable this type stubs in oniwa/metaphor are needed
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
